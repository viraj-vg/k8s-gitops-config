apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/viraj-vg/k8s-gitops-config.git
    targetRevision: HEAD
    path: charts/ui
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
