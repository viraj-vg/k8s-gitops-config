replicaCount: 1

image:
  repository: devopsviraj/retail-cart
  tag: "1.0.0"

port: 8080
healthPath: /actuator/health
probeDelaySeconds: 60

config:
  RETAIL_CART_PERSISTENCE_PROVIDER: "in-memory"

secret:
  PLACEHOLDER_KEY: "not-a-real-secret"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  host: cart.local
